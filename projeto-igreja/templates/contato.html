{% extends 'base.html' %}

{% block content %}

<section class="container py-5">

    <!-- Título -->

    <div class="row mb-5">

        <div class="col-12 text-center">

            <h1 class="fw-bold">

                Contato

            </h1>

            <p class="lead">

                Entre em contato conosco.
                Será um prazer falar com você.

            </p>

        </div>

    </div>

    <!-- Conteúdo -->

    <div class="row align-items-center g-4">

        <!-- Informações -->

        <div class="col-12 col-lg-5">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body p-4">

                    <h3 class="mb-4">

                        Informações

                    </h3>

                    <!-- Endereço -->

                    <div class="mb-4">

                        <h5>

                            <i class="bi bi-geo-alt-fill"></i>
                            Endereço

                        </h5>

                        <p class="mb-0">

                            Centro, Guarulhos - SP

                        </p>

                    </div>

                    <!-- Telefone -->

                    <div class="mb-4">

                        <h5>

                            <i class="bi bi-telephone-fill"></i>
                            Telefone

                        </h5>

                        <p class="mb-0">

                            (11) 99999-9999

                        </p>

                    </div>

                    <!-- Email -->

                    <div>

                        <h5>

                            <i class="bi bi-envelope-fill"></i>
                            Email

                        </h5>

                        <p class="mb-0">

                            contato@igrejaluzesperanca.com.br

                        </p>

                    </div>

                </div>

            </div>

        </div>

        <!-- Mapa -->

        <div class="col-12 col-lg-7">

            <div class="shadow rounded overflow-hidden">

                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14639.30729396408!2d-46.540352232825356!3d-23.466710378798904!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94cef55c7c86048d%3A0xb46307dc4ad8b735!2sCentro%2C%20Guarulhos%20-%20SP!5e0!3m2!1spt-BR!2sbr!4v1778425899184!5m2!1spt-BR!2sbr"
                    width="100%"
                    height="450"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                >
                </iframe>

            </div>

        </div>

    </div>

</section>

{% endblock %}
