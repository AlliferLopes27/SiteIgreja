{% extends 'admin/dashboard.html' %}

{% block content %}

<div class="container py-5">

    <!-- Título -->

    <div class="mb-4">

        <h1 class="text-center text-md-start">

            Editar Evento

        </h1>

        <p class="text-muted text-center text-md-start">

            Atualize as informações do evento.

        </p>

    </div>

    <!-- Card -->

    <div class="card shadow border-0">

        <div class="card-body p-4">

            <form method="POST">

                <!-- Título -->

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        Título

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="titulo"
                        value="{{ evento.titulo }}"
                        required
                    >

                </div>

                <!-- Descrição -->

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        Descrição

                    </label>

                    <textarea
                        class="form-control"
                        name="descricao"
                        rows="5"
                        required
                    >{{ evento.descricao }}</textarea>

                </div>

                <!-- Linha Data/Hora -->

                <div class="row">

                    <!-- Data -->

                    <div class="col-12 col-md-6 mb-4">

                        <label class="form-label fw-bold">

                            Data

                        </label>

                        <input
                            type="date"
                            class="form-control"
                            name="data"
                            value="{{ evento.data }}"
                            required
                        >

                    </div>

                    <!-- Hora -->

                    <div class="col-12 col-md-6 mb-4">

                        <label class="form-label fw-bold">

                            Hora

                        </label>

                        <input
                            type="time"
                            class="form-control"
                            name="hora"
                            value="{{ evento.hora }}"
                            required
                        >

                    </div>

                </div>

                <!-- Botões -->

                <div class="d-flex flex-column flex-md-row gap-3">

                    <!-- Atualizar -->

                    <button class="btn btn-primary">

                        <i class="bi bi-arrow-clockwise"></i>

                        Atualizar Evento

                    </button>

                    <!-- Voltar -->

                    <a
                        href="{{ url_for('admin.eventos') }}"
                        class="btn btn-secondary"
                    >

                        <i class="bi bi-arrow-return-left"></i>

                        Voltar

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
