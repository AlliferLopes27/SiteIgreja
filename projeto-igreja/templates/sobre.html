{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h1>Sobre Nós</h1>

    <div class="row mt-4">

        <div class="col-md-6">

            <img
                src="{{ url_for('static', filename='img/Imagem.png') }}"
                class="img-fluid rounded shadow"
            >

        </div>

        <div class="col-md-6">

            <h3>História da Igreja</h3>

            <p>
                A Igreja Comunidade Luz e Esperança foi criada
                para levar fé e esperança para toda a comunidade.
            </p>

            <h3>Missão</h3>

            <p>
                Levar a palavra de Deus.
            </p>

            <h3>Visão</h3>

            <p>
                Transformar vidas.
            </p>

            <h3>Valores</h3>

            <ul>
                <li>Amor</li>
                <li>Respeito</li>
                <li>União</li>
            </ul>

        </div>

    </div>

</div>

{% endblock %}
