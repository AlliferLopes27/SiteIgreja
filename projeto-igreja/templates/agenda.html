{% extends 'base.html' %}

{% block content %}

<section class="container py-5">

    <!-- Título -->

    <div class="row mb-5 text-center">

        <div class="col-12">

            <h1 class="fw-bold">

                Agenda de Eventos

            </h1>

            <p class="lead">

                Confira os próximos eventos e participe conosco.

            </p>

        </div>

    </div>

    <!-- Eventos -->

    <div class="row g-4">

        {% for evento in eventos %}

        <div class="col-12 col-md-6 col-lg-4">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body d-flex flex-column">

                    <!-- Título -->

                    <h4 class="fw-bold mb-3">

                        {{ evento.titulo }}

                    </h4>

                    <!-- Descrição -->

                    <p class="text-muted flex-grow-1">

                        {{ evento.descricao }}

                    </p>

                    <!-- Data -->

                    <div class="mt-3">

                        <p class="mb-2">

                            <i class="bi bi-calendar-event-fill"></i>

                            <strong>Data:</strong>

                            {{ evento.data }}

                        </p>

                        <p class="mb-0">

                            <i class="bi bi-clock-fill"></i>

                            <strong>Hora:</strong>

                            {{ evento.hora }}

                        </p>

                    </div>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</section>

{% endblock %}
