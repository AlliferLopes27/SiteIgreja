{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h1>Agenda de Eventos</h1>

    <table class="table table-striped mt-4">

        <thead>

            <tr>
                <th>Título</th>
                <th>Descrição</th>
                <th>Data</th>
                <th>Hora</th>
            </tr>

        </thead>

        <tbody>

            {% for evento in eventos %}

            <tr>

                <td>{{ evento.titulo }}</td>

                <td>{{ evento.descricao }}</td>

                <td>{{ evento.data }}</td>

                <td>{{ evento.hora }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
